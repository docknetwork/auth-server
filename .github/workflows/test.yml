name: Tests

on: [pull_request]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install
        run: |
          yarn install --frozen-lockfile

      - name: Format check
        run: yarn format-check

      - name: Lint
        run: yarn lint

      - name: Run tests
        run: yarn coverage
